train:
  datasets:
    cc12m:
      type: multimodal

      # Input and output domain names, separated by hyphen
      in_domains: tok_rgb@224-tok_depth@224
      out_domains: tok_rgb@224-tok_depth@224

      # Dirichlet alphas concentration parameter for input and output.
      # Can be either one value, or one value per input modality separated by hyphen.
      input_alphas: null
      target_alphas: null
      # Path to specific alphas configuration to enable mixture of Dirichlets.
      # If provided, overrides input_alphas and target_alphas
      alphas_config: "/opt/repo/ml-4m/cfgs/neural/4m/modal/alphas_mixture/rgb2depth-all2all-no-neural.yaml"

      # Optionally, min_input_tokens, min_target_tokens, num_input_tokens, num_target_tokens can be specified here
      # If so, they will override the values provided in the main config

      # Data can either be local or on cloud storage (e.g. S3), see data docs for more info
      # Use braceexpand notation to indicate shard range (e.g. shard-{0000..9999}.tar)
      # Use brackets to indicate multiple modalities (e.g. [modality1,modality2,modality3])
      data_path: '/project/data/train/cc12m/[tok_rgb@224,tok_depth@224,crop_settings]/shard-{00000..00052}.tar'
      use_wds: True # Use webdataset
      wds_n_repeats: 2 # Number of repeats for webdataset loader to improve efficiency
      wds_shuffle_buffer_tar: 1_000 # Webdatasets shuffle buffer after loading tar files
      wds_shuffle_buffer_repeat: 1_000 # Webdatasets shuffle buffer after repeating samples

      main_augment_domain: rgb@224 # Select from which modality to get the original full image size (mostly important for resizing bounding boxes)
      aligned_captions: False # Align captions to crop_settings
      tok_train_aug: True # Apply data augmentation to tokens (if multiple crop settings are available)

    things:
      type: multimodal

      # tok_dinov2@224 tokens pre-computed from THINGS images via DINOv2-B/14 + VQVAE tokenizer.
      in_domains: tok_rgb@224-tok_depth@224-tok_dinov2@224
      out_domains: tok_rgb@224-tok_depth@224-tok_dinov2@224

      input_alphas: null
      target_alphas: null
      alphas_config: "/opt/repo/ml-4m/cfgs/neural/4m/modal/alphas_mixture/rgb-dinov2-bidirectional-all2all.yaml"

      data_path: '/project/data/train/things/[tok_rgb,tok_depth,tok_dinov2@224]/shard_{000..026}.tar'
      use_wds: True # Use webdataset
      wds_n_repeats: 2 # Number of repeats for webdataset loader to improve efficiency
      wds_shuffle_buffer_tar: 1_000 # Webdatasets shuffle buffer after loading tar files
      wds_shuffle_buffer_repeat: 1_000 # Webdatasets shuffle buffer after repeating samples

      main_augment_domain: rgb@224 # Select from which modality to get the original full image size (mostly important for resizing bounding boxes)
      aligned_captions: False # Align captions to crop_settings
      tok_train_aug: False # Apply data augmentation to tokens (if multiple crop settings are available)
      modality_name_map:
        tok_rgb: tok_rgb@224
        tok_depth: tok_depth@224

  weights: [5.0, 1.0] # Sampling weights for the training datasets

val:
  datasets:
    cc12m:
      use_wds: True
      data_path: '/project/data/val/cc12m/[tok_rgb@224,tok_depth@224,crop_settings]/shard-{00055..00059}.tar'
    things:
      use_wds: True
      data_path: '/project/data/val/things/[tok_rgb,tok_depth,tok_dinov2@224]/shard_{000..026}.tar'
      modality_name_map:
        tok_rgb: tok_rgb@224
        tok_depth: tok_depth@224
