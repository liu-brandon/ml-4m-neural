# Bidirectional pixel↔MEG_rvq0 + all2all (3 components, equal weighting)
# Identical to rgb-meg-bidirectional-all2all.yaml but only tok_meg_rvq0.
# rvq1-3 are excluded — use this when training the pixel_meg_rvq0 condition
# to avoid the near-random gradient signal from residual RVQ layers.
sampling_weights: [0.33, 0.33, 0.33]
alphas_mixture:
  tok_rgb@224:
    input_alphas: [1000., 0., 0.5]
    target_alphas: [0., 0.5, 0.5]
  tok_depth@224:
    input_alphas: [1000., 0., 0.5]
    target_alphas: [0., 0.5, 0.5]
  tok_meg_rvq0:
    input_alphas: [0., 1000., 0.5]
    target_alphas: [0.5, 0., 0.5]
